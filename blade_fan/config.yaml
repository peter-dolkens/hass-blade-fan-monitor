# Home Assistant add-on manifest. Installs into a supervised HAOS instance.
name: Blade Fan Monitor
version: "0.2.0"
slug: blade_fan
description: >-
  Reports the Compute Blade fan unit's speed (tach on GPIO13) and the duty the
  kernel pwm-fan driver is applying, as Home Assistant sensors.
url: https://github.com/peter-dolkens/blade-fan-monitor
arch:
  - aarch64
init: false
startup: services
boot: auto
# Preferred: MQTT discovery (unique_ids + a device) via the Mosquitto add-on.
services:
  - mqtt:want
# Fallback without a broker: plain states pushed via /core/api/states.
homeassistant_api: true
# Tach is read as GPIO edge events through the character device.
gpio: true
devices:
  - /dev/gpiochip0

options:
  tach_gpio: 13
  gpio_chip_label: pinctrl-rp1
  pulses_per_rev: 2
  interval_seconds: 10
  stall_seconds: 30
  entity_prefix: blade_fan
  discovery_prefix: homeassistant
  log_level: info

schema:
  # BCM GPIO number of the fan tach line (Compute Blade: 13).
  tach_gpio: int(0,53)
  # Chip is found by label, so a renumbered /dev/gpiochipN can't misdirect it.
  gpio_chip_label: str
  # Noctua fans: 2 tach pulses per revolution.
  pulses_per_rev: int(1,8)
  interval_seconds: int(2,300)
  # Duty > 0 with no tach pulses for this long raises the stall alarm.
  stall_seconds: int(5,600)
  # Also the MQTT unique_id / device identifier and topic root.
  entity_prefix: match(^[a-z0-9_]+$)
  discovery_prefix: str
  log_level: list(debug|info|warn|error)
